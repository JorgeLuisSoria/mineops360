<template>
  <lightning-card title={title} icon-name="standard:case">
    <div class="slds-p-horizontal_small">
      <lightning-record-edit-form
        object-api-name="Case"
        onsuccess={handleSuccess}
        onerror={handleError}
      >
        <lightning-messages></lightning-messages>
        <lightning-input-field
          field-name="Equipment__c"
          value={equipmentId}
        ></lightning-input-field>
        <lightning-input-field
          field-name="Subject"
          required
        ></lightning-input-field>
        <lightning-input-field field-name="Description"></lightning-input-field>
        <lightning-input-field field-name="Priority"></lightning-input-field>
        <div class="slds-m-top_small">
          <lightning-button
            variant="brand"
            type="submit"
            label="Enviar reporte"
          ></lightning-button>
        </div>
      </lightning-record-edit-form>
      <template lwc:if={createdCaseId}>
        <p class="slds-m-top_small slds-text-color_success" data-id="success">
          Tu reporte fue registrado correctamente.
        </p>
      </template>
      <template lwc:if={error}>
        <p class="slds-m-top_small slds-text-color_error" data-id="error">
          {error}
        </p>
      </template>
    </div>
  </lightning-card>
</template>
